<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Fission License Admin</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: #0d1117; color: #e6edf3; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; min-height: 100vh; }
    .header { background: #161b22; border-bottom: 1px solid #30363d; padding: 16px 32px; display: flex; align-items: center; gap: 16px; }
    .header h1 { font-size: 18px; font-weight: 700; color: #58a6ff; }
    .header span { color: #8b949e; font-size: 13px; }
    .nav { display: flex; gap: 4px; padding: 16px 32px 0; border-bottom: 1px solid #30363d; }
    .nav button { background: none; border: none; border-bottom: 2px solid transparent; padding: 8px 16px; color: #8b949e; font-size: 14px; cursor: pointer; transition: all 0.15s; }
    .nav button.active { color: #58a6ff; border-bottom-color: #58a6ff; }
    .nav button:hover { color: #e6edf3; }
    .content { padding: 24px 32px; max-width: 1200px; }
    .section { display: none; }
    .section.active { display: block; }
    .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 16px; margin-bottom: 24px; }
    .stat-card { background: #161b22; border: 1px solid #30363d; border-radius: 8px; padding: 20px; }
    .stat-card .label { color: #8b949e; font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 8px; }
    .stat-card .value { font-size: 28px; font-weight: 700; color: #e6edf3; }
    .stat-card .sub { color: #8b949e; font-size: 12px; margin-top: 4px; }
    table { width: 100%; border-collapse: collapse; background: #161b22; border: 1px solid #30363d; border-radius: 8px; overflow: hidden; }
    th { background: #21262d; color: #8b949e; font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px; padding: 10px 16px; text-align: left; border-bottom: 1px solid #30363d; }
    td { padding: 12px 16px; border-bottom: 1px solid #21262d; font-size: 13px; vertical-align: top; }
    tr:last-child td { border-bottom: none; }
    tr:hover td { background: #1c2128; }
    .badge { display: inline-block; padding: 2px 8px; border-radius: 4px; font-size: 11px; font-weight: 600; text-transform: uppercase; }
    .badge-active { background: #1a3a2a; color: #3fb950; border: 1px solid #2d6a3f; }
    .badge-expired { background: #3a2a1a; color: #d29922; border: 1px solid #6a4f2d; }
    .badge-revoked { background: #3a1a1a; color: #f85149; border: 1px solid #6a2d2d; }
    .badge-starter { background: #21262d; color: #8b949e; border: 1px solid #30363d; }
    .badge-professional { background: #1a2a3a; color: #58a6ff; border: 1px solid #2d4a6a; }
    .badge-enterprise { background: #2a1a3a; color: #a371f7; border: 1px solid #4a2d6a; }
    .btn { padding: 8px 16px; border-radius: 6px; border: 1px solid #30363d; background: #21262d; color: #e6edf3; font-size: 13px; cursor: pointer; transition: all 0.15s; }
    .btn:hover { border-color: #58a6ff; color: #58a6ff; }
    .btn-danger { border-color: #f85149; color: #f85149; }
    .btn-danger:hover { background: #3a1a1a; }
    .btn-primary { background: #238636; border-color: #2ea043; color: #fff; }
    .btn-primary:hover { background: #2ea043; }
    .form-group { margin-bottom: 16px; }
    .form-group label { display: block; color: #8b949e; font-size: 12px; font-weight: 600; margin-bottom: 6px; text-transform: uppercase; letter-spacing: 0.5px; }
    .form-group input, .form-group select { width: 100%; background: #0d1117; border: 1px solid #30363d; border-radius: 6px; padding: 8px 12px; color: #e6edf3; font-size: 13px; outline: none; transition: border-color 0.15s; }
    .form-group input:focus, .form-group select:focus { border-color: #58a6ff; }
    .form-group select option { background: #161b22; }
    .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
    .form-card { background: #161b22; border: 1px solid #30363d; border-radius: 8px; padding: 24px; max-width: 600px; }
    .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.7); z-index: 100; align-items: center; justify-content: center; }
    .modal-overlay.open { display: flex; }
    .modal { background: #161b22; border: 1px solid #30363d; border-radius: 12px; padding: 28px; max-width: 600px; width: 90%; }
    .modal h3 { margin-bottom: 16px; font-size: 16px; }
    .license-key-box { background: #0d1117; border: 1px solid #30363d; border-radius: 6px; padding: 12px; font-family: monospace; font-size: 11px; word-break: break-all; color: #3fb950; line-height: 1.5; max-height: 150px; overflow-y: auto; }
    .alert { padding: 12px 16px; border-radius: 6px; margin-bottom: 16px; font-size: 13px; }
    .alert-error { background: #3a1a1a; border: 1px solid #6a2d2d; color: #f85149; }
    .alert-success { background: #1a3a2a; border: 1px solid #2d6a3f; color: #3fb950; }
    .api-key-bar { background: #161b22; border: 1px solid #30363d; border-radius: 6px; padding: 12px 16px; margin: 16px 32px; display: flex; align-items: center; gap: 12px; }
    .api-key-bar input { flex: 1; background: #0d1117; border: 1px solid #30363d; border-radius: 4px; padding: 6px 10px; color: #e6edf3; font-family: monospace; font-size: 12px; outline: none; }
    .api-key-bar label { color: #8b949e; font-size: 12px; white-space: nowrap; }
    .mono { font-family: monospace; font-size: 11px; }
    .text-muted { color: #8b949e; }
    .loading { color: #8b949e; font-size: 13px; padding: 24px; text-align: center; }
    .section-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px; }
    .section-header h2 { font-size: 16px; font-weight: 600; }
  </style>
</head>
<body>
  <div class="header">
    <h1>⚡ Fission License Admin</h1>
    <span>License Management Portal</span>
  </div>

  <div class="api-key-bar">
    <label>Admin API Key:</label>
    <input type="password" id="apiKeyInput" placeholder="Enter admin API key..." />
    <button class="btn" onclick="saveApiKey()">Save</button>
    <span id="apiKeyStatus" class="text-muted" style="font-size:12px;"></span>
  </div>

  <div class="nav">
    <button class="active" onclick="showTab('dashboard')">Dashboard</button>
    <button onclick="showTab('licenses')">Licenses</button>
    <button onclick="showTab('generate')">Generate License</button>
  </div>

  <div class="content">
    <!-- Dashboard -->
    <div id="tab-dashboard" class="section active">
      <div id="stats-loading" class="loading">Loading stats…</div>
      <div id="stats-grid" class="stats-grid" style="display:none;"></div>
    </div>

    <!-- Licenses Table -->
    <div id="tab-licenses" class="section">
      <div class="section-header">
        <h2>All Licenses</h2>
        <button class="btn" onclick="loadLicenses()">↻ Refresh</button>
      </div>
      <div id="licenses-loading" class="loading">Loading…</div>
      <div id="licenses-table" style="display:none;"></div>
    </div>

    <!-- Generate License -->
    <div id="tab-generate" class="section">
      <div class="form-card">
        <h2 style="margin-bottom:20px;font-size:16px;">Generate New License</h2>
        <div id="gen-alert"></div>
        <div class="form-row">
          <div class="form-group">
            <label>Organization Name</label>
            <input type="text" id="gen-org_name" placeholder="Acme Corp" />
          </div>
          <div class="form-group">
            <label>Organization Email</label>
            <input type="email" id="gen-org_email" placeholder="admin@acme.com" />
          </div>
        </div>
        <div class="form-row">
          <div class="form-group">
            <label>Tier</label>
            <select id="gen-tier">
              <option value="starter">Starter</option>
              <option value="professional">Professional</option>
              <option value="enterprise">Enterprise</option>
            </select>
          </div>
          <div class="form-group">
            <label>Expiry (days)</label>
            <input type="number" id="gen-expires_days" value="365" min="1" />
          </div>
        </div>
        <div class="form-row">
          <div class="form-group">
            <label>Max Users</label>
            <input type="number" id="gen-max_users" value="10" min="1" />
          </div>
          <div class="form-group">
            <label>Max Incidents</label>
            <input type="number" id="gen-max_incidents" value="100" min="1" />
          </div>
        </div>
        <button class="btn btn-primary" onclick="generateLicense()" style="width:100%;margin-top:8px;">Generate License Key</button>
      </div>
    </div>
  </div>

  <!-- Generated Key Modal -->
  <div id="modal-overlay" class="modal-overlay" onclick="closeModal(event)">
    <div class="modal">
      <h3>✅ License Key Generated</h3>
      <p style="color:#8b949e;font-size:13px;margin-bottom:12px;">Copy this key and send it to the customer. It cannot be retrieved again.</p>
      <div id="modal-key" class="license-key-box"></div>
      <div style="display:flex;gap:8px;margin-top:16px;">
        <button class="btn btn-primary" onclick="copyKey()">Copy to Clipboard</button>
        <button class="btn" onclick="document.getElementById('modal-overlay').classList.remove('open')">Close</button>
      </div>
      <div id="copy-confirm" style="color:#3fb950;font-size:12px;margin-top:8px;display:none;">Copied!</div>
    </div>
  </div>

  <!-- Revoke Modal -->
  <div id="revoke-overlay" class="modal-overlay" onclick="closeRevokeModal(event)">
    <div class="modal">
      <h3>⚠️ Revoke License</h3>
      <p style="color:#8b949e;font-size:13px;margin-bottom:12px;">This action is irreversible.</p>
      <div class="form-group">
        <label>Revocation Reason</label>
        <input type="text" id="revoke-reason" placeholder="e.g. Customer request, non-payment" />
      </div>
      <input type="hidden" id="revoke-key" />
      <div style="display:flex;gap:8px;margin-top:8px;">
        <button class="btn btn-danger" onclick="confirmRevoke()">Revoke License</button>
        <button class="btn" onclick="document.getElementById('revoke-overlay').classList.remove('open')">Cancel</button>
      </div>
    </div>
  </div>

  <script>
    const BASE = '';

    function getApiKey() {
      return localStorage.getItem('fission_admin_api_key') || '';
    }

    function saveApiKey() {
      const val = document.getElementById('apiKeyInput').value.trim();
      if (val) {
        localStorage.setItem('fission_admin_api_key', val);
        document.getElementById('apiKeyStatus').textContent = '✓ Saved';
        loadDashboard();
      }
    }

    function apiHeaders() {
      return { 'Content-Type': 'application/json', 'x-admin-api-key': getApiKey() };
    }

    function showTab(name) {
      document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
      document.querySelectorAll('.nav button').forEach(b => b.classList.remove('active'));
      document.getElementById('tab-' + name).classList.add('active');
      event.target.classList.add('active');
      if (name === 'dashboard') loadDashboard();
      if (name === 'licenses') loadLicenses();
    }

    async function loadDashboard() {
      const loading = document.getElementById('stats-loading');
      const grid = document.getElementById('stats-grid');
      loading.style.display = 'block';
      grid.style.display = 'none';
      try {
        const res = await fetch(BASE + '/admin/stats', { headers: apiHeaders() });
        if (!res.ok) throw new Error('Unauthorized');
        const d = await res.json();
        grid.innerHTML = `
          <div class="stat-card"><div class="label">Total Licenses</div><div class="value">${d.total}</div></div>
          <div class="stat-card"><div class="label">Active</div><div class="value" style="color:#3fb950">${d.active}</div></div>
          <div class="stat-card"><div class="label">Revoked</div><div class="value" style="color:#f85149">${d.revoked}</div></div>
          <div class="stat-card"><div class="label">Expiring (30d)</div><div class="value" style="color:#d29922">${d.expiring_30d}</div></div>
          <div class="stat-card"><div class="label">Starter</div><div class="value" style="color:#8b949e">${d.by_tier.starter}</div></div>
          <div class="stat-card"><div class="label">Professional</div><div class="value" style="color:#58a6ff">${d.by_tier.professional}</div></div>
          <div class="stat-card"><div class="label">Enterprise</div><div class="value" style="color:#a371f7">${d.by_tier.enterprise}</div></div>
        `;
        loading.style.display = 'none';
        grid.style.display = 'grid';
      } catch (e) {
        loading.textContent = '⚠ Failed to load stats. Check your API key.';
      }
    }

    async function loadLicenses() {
      const loading = document.getElementById('licenses-loading');
      const container = document.getElementById('licenses-table');
      loading.style.display = 'block';
      container.style.display = 'none';
      try {
        const res = await fetch(BASE + '/admin/licenses', { headers: apiHeaders() });
        if (!res.ok) throw new Error('Unauthorized');
        const licenses = await res.json();
        const rows = licenses.map(l => {
          const now = new Date();
          const exp = new Date(l.expires_at);
          const status = l.revoked ? 'revoked' : exp < now ? 'expired' : 'active';
          const statusClass = `badge badge-${status}`;
          const tierClass = `badge badge-${l.tier}`;
          return `<tr>
            <td><div style="font-weight:600;font-size:13px;">${escHtml(l.org_name)}</div><div class="text-muted mono" style="font-size:11px;">${escHtml(l.org_email)}</div></td>
            <td><span class="${tierClass}">${l.tier}</span></td>
            <td><span class="${statusClass}">${status}</span></td>
            <td class="text-muted" style="font-size:12px;">${formatDate(l.expires_at)}</td>
            <td class="text-muted" style="font-size:12px;">${l.last_validated_at ? formatDate(l.last_validated_at) : '—'}</td>
            <td>${status !== 'revoked' ? `<button class="btn btn-danger" style="padding:4px 10px;font-size:12px;" onclick="revokeModal('${escHtml(l.license_key)}')">Revoke</button>` : '<span class="text-muted" style="font-size:12px;">Revoked</span>'}</td>
          </tr>`;
        }).join('');
        container.innerHTML = `<table>
          <thead><tr><th>Organization</th><th>Tier</th><th>Status</th><th>Expires</th><th>Last Validated</th><th>Actions</th></tr></thead>
          <tbody>${rows || '<tr><td colspan="6" style="text-align:center;color:#8b949e;">No licenses found</td></tr>'}</tbody>
        </table>`;
        loading.style.display = 'none';
        container.style.display = 'block';
      } catch (e) {
        loading.textContent = '⚠ Failed to load licenses. Check your API key.';
      }
    }

    async function generateLicense() {
      const alertDiv = document.getElementById('gen-alert');
      alertDiv.innerHTML = '';
      const body = {
        org_name: document.getElementById('gen-org_name').value.trim(),
        org_email: document.getElementById('gen-org_email').value.trim(),
        tier: document.getElementById('gen-tier').value,
        expires_days: parseInt(document.getElementById('gen-expires_days').value),
        max_users: parseInt(document.getElementById('gen-max_users').value),
        max_incidents: parseInt(document.getElementById('gen-max_incidents').value),
      };
      if (!body.org_name || !body.org_email) {
        alertDiv.innerHTML = '<div class="alert alert-error">Organization name and email are required.</div>';
        return;
      }
      try {
        const res = await fetch(BASE + '/licenses/generate', {
          method: 'POST',
          headers: apiHeaders(),
          body: JSON.stringify(body),
        });
        const data = await res.json();
        if (!res.ok) {
          alertDiv.innerHTML = `<div class="alert alert-error">${data.error || 'Failed to generate license'}</div>`;
          return;
        }
        document.getElementById('modal-key').textContent = data.license_key;
        document.getElementById('modal-overlay').classList.add('open');
      } catch (e) {
        alertDiv.innerHTML = '<div class="alert alert-error">Network error. Is the server running?</div>';
      }
    }

    function copyKey() {
      const key = document.getElementById('modal-key').textContent;
      navigator.clipboard.writeText(key).then(() => {
        const c = document.getElementById('copy-confirm');
        c.style.display = 'block';
        setTimeout(() => c.style.display = 'none', 2000);
      });
    }

    function closeModal(e) {
      if (e.target === document.getElementById('modal-overlay')) {
        document.getElementById('modal-overlay').classList.remove('open');
      }
    }

    function revokeModal(key) {
      document.getElementById('revoke-key').value = key;
      document.getElementById('revoke-reason').value = '';
      document.getElementById('revoke-overlay').classList.add('open');
    }

    function closeRevokeModal(e) {
      if (e.target === document.getElementById('revoke-overlay')) {
        document.getElementById('revoke-overlay').classList.remove('open');
      }
    }

    async function confirmRevoke() {
      const key = document.getElementById('revoke-key').value;
      const reason = document.getElementById('revoke-reason').value.trim() || 'Revoked by admin';
      try {
        const res = await fetch(BASE + '/admin/licenses/' + encodeURIComponent(key), {
          method: 'DELETE',
          headers: apiHeaders(),
          body: JSON.stringify({ reason }),
        });
        if (res.ok) {
          document.getElementById('revoke-overlay').classList.remove('open');
          loadLicenses();
        }
      } catch (e) {
        alert('Failed to revoke license');
      }
    }

    function escHtml(str) {
      return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
    }

    function formatDate(str) {
      if (!str) return '—';
      return new Date(str).toLocaleDateString('en-US', { year: 'numeric', month: 'short', day: 'numeric' });
    }

    // Init
    const savedKey = localStorage.getItem('fission_admin_api_key');
    if (savedKey) {
      document.getElementById('apiKeyInput').value = savedKey;
      document.getElementById('apiKeyStatus').textContent = '✓ Loaded';
      loadDashboard();
    }
  </script>
</body>
</html>
