<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <defs>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.2" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <!-- Vertical stem of F -->
  <rect x="6" y="4" width="5" height="24" rx="1" fill="#58a6ff" filter="url(#glow)"/>
  <!-- Top horizontal bar of F -->
  <rect x="6" y="4" width="18" height="5" rx="1" fill="#58a6ff" filter="url(#glow)"/>
  <!-- Middle horizontal bar of F -->
  <rect x="6" y="13" width="13" height="4" rx="1" fill="#58a6ff" filter="url(#glow)"/>
  <!-- Accent: angled split line suggesting fission -->
  <line x1="20" y1="16" x2="27" y2="28" stroke="#79c0ff" stroke-width="2" stroke-linecap="round" opacity="0.6"/>
  <line x1="20" y1="16" x2="27" y2="4" stroke="#79c0ff" stroke-width="2" stroke-linecap="round" opacity="0.6"/>
  <!-- Nucleus dot -->
  <circle cx="20" cy="16" r="2.5" fill="#58a6ff"/>
</svg>
