<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 40" fill="none">
  <!-- Outer ring -->
  <circle cx="20" cy="20" r="17" stroke="#f97316" stroke-width="1.8" fill="none" opacity="0.9"/>
  <!-- Inner ring -->
  <circle cx="20" cy="20" r="10" stroke="#f97316" stroke-width="1.4" fill="none" opacity="0.85"/>
  <!-- Center dot -->
  <circle cx="20" cy="20" r="2.5" fill="#f97316"/>
  <!-- Cross lines — top gap between outer and inner -->
  <line x1="20" y1="3" x2="20" y2="10" stroke="#f97316" stroke-width="1.8" stroke-linecap="round"/>
  <!-- Cross lines — bottom -->
  <line x1="20" y1="30" x2="20" y2="37" stroke="#f97316" stroke-width="1.8" stroke-linecap="round"/>
  <!-- Cross lines — left -->
  <line x1="3" y1="20" x2="10" y2="20" stroke="#f97316" stroke-width="1.8" stroke-linecap="round"/>
  <!-- Cross lines — right -->
  <line x1="30" y1="20" x2="37" y2="20" stroke="#f97316" stroke-width="1.8" stroke-linecap="round"/>
  <!-- Node dots at cardinal tips -->
  <circle cx="20" cy="3" r="1.8" fill="#f97316"/>
  <circle cx="20" cy="37" r="1.8" fill="#f97316"/>
  <circle cx="3" cy="20" r="1.8" fill="#f97316"/>
  <circle cx="37" cy="20" r="1.8" fill="#f97316"/>
  <!-- Diagonal network spokes (subtle) -->
  <line x1="9" y1="9" x2="13.5" y2="13.5" stroke="#f97316" stroke-width="1" stroke-linecap="round" opacity="0.45"/>
  <line x1="31" y1="9" x2="26.5" y2="13.5" stroke="#f97316" stroke-width="1" stroke-linecap="round" opacity="0.45"/>
  <line x1="9" y1="31" x2="13.5" y2="26.5" stroke="#f97316" stroke-width="1" stroke-linecap="round" opacity="0.45"/>
  <line x1="31" y1="31" x2="26.5" y2="26.5" stroke="#f97316" stroke-width="1" stroke-linecap="round" opacity="0.45"/>
  <!-- Small node dots at diagonal tips -->
  <circle cx="9" cy="9" r="1.3" fill="#f97316" opacity="0.55"/>
  <circle cx="31" cy="9" r="1.3" fill="#f97316" opacity="0.55"/>
  <circle cx="9" cy="31" r="1.3" fill="#f97316" opacity="0.55"/>
  <circle cx="31" cy="31" r="1.3" fill="#f97316" opacity="0.55"/>
</svg>
