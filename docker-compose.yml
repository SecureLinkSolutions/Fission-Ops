version: '3.9'

services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_DB: fission_ops
      POSTGRES_USER: fission
      POSTGRES_PASSWORD: fission_secret
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fission -d fission_ops"]
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      - "5432:5432"
    labels:
      - "com.centurylinklabs.watchtower.enable=true"

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://fission:fission_secret@postgres:5432/fission_ops
      JWT_SECRET: dev_secret_minimum_32_characters_long
      PORT: 3001
      FRONTEND_URL: http://localhost:3000
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
    ports:
      - "3001:3001"
    labels:
      - "com.centurylinklabs.watchtower.enable=false"

  frontend:
    build: ./frontend
    depends_on:
      - backend
    environment:
      VITE_API_URL: http://localhost:3001/api/v1
    ports:
      - "3000:80"
    labels:
      - "com.centurylinklabs.watchtower.enable=false"

  license-db:
    image: postgres:15
    environment:
      POSTGRES_DB: fission_license
      POSTGRES_USER: license_user
      POSTGRES_PASSWORD: license_secret
    volumes:
      - license_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U license_user -d fission_license"]
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      - "5433:5432"
    labels:
      - "com.centurylinklabs.watchtower.enable=true"

  license-server:
    build:
      context: ./fission-license-server
      dockerfile: Dockerfile
    depends_on:
      license-db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://license_user:license_secret@license-db:5432/fission_license
      PORT: 3002
      ADMIN_API_KEY: dev_admin_api_key_change_me
      NODE_ENV: development
    ports:
      - "3002:3002"
    volumes:
      - license_keys:/app/keys
    labels:
      - "com.centurylinklabs.watchtower.enable=false"

  watchtower:
    image: containrrr/watchtower
    container_name: watchtower
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      # Only update containers labelled enable=true
      WATCHTOWER_LABEL_ENABLE: "true"
      # Check for updates every 24 hours (86400 seconds)
      WATCHTOWER_POLL_INTERVAL: "86400"
      # Send notification email on update (fill in your SMTP details in .env)
      WATCHTOWER_NOTIFICATIONS: ${WATCHTOWER_NOTIFICATIONS:-}
      WATCHTOWER_NOTIFICATION_EMAIL_FROM: ${WATCHTOWER_EMAIL_FROM:-}
      WATCHTOWER_NOTIFICATION_EMAIL_TO: ${WATCHTOWER_EMAIL_TO:-}
      WATCHTOWER_NOTIFICATION_EMAIL_SERVER: ${WATCHTOWER_EMAIL_SERVER:-}
      WATCHTOWER_NOTIFICATION_EMAIL_SERVER_PORT: ${WATCHTOWER_EMAIL_SERVER_PORT:-587}
      WATCHTOWER_NOTIFICATION_EMAIL_SERVER_USER: ${WATCHTOWER_EMAIL_USER:-}
      WATCHTOWER_NOTIFICATION_EMAIL_SERVER_PASSWORD: ${WATCHTOWER_EMAIL_PASSWORD:-}
      # Log level
      WATCHTOWER_DEBUG: "false"
    labels:
      - "com.centurylinklabs.watchtower.enable=false"

volumes:
  postgres_data:
  license_db_data:
  license_keys:
