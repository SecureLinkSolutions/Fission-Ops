version: '3.9'

services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_DB: fission_ops
      POSTGRES_USER: fission
      POSTGRES_PASSWORD: fission_secret
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fission -d fission_ops"]
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      - "5432:5432"

  backend:
    build: ./backend
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://fission:fission_secret@postgres:5432/fission_ops
      JWT_SECRET: dev_secret_minimum_32_characters_long
      PORT: 3001
      FRONTEND_URL: http://localhost:3000
    ports:
      - "3001:3001"

  frontend:
    build: ./frontend
    depends_on:
      - backend
    environment:
      VITE_API_URL: http://localhost:3001/api/v1
    ports:
      - "3000:80"

volumes:
  postgres_data:
